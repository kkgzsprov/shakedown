# Runnable Switchyard example from this source checkout.
# When copied to another game, edit cwd, command/replay_command, names and keys.
# Save TOML as UTF-8 without a byte-order mark (BOM).
[game]
cwd = "../../.."
command = ["{python}", "-m", "examples.switchyard", "--headless", "--seed", "{seed}", "--map", "{map}", "--duration", "{seconds}", "--profile-name", "{profile}", "--decider", "{decider_mode}", "--tuning", "{tuning_file}", "--telemetry", "{run_dir}/telemetry.jsonl", "--record-inputs", "{run_dir}/inputs.json"]
replay_command = ["{python}", "-m", "examples.switchyard", "--replay-inputs", "{inputs_file}", "--telemetry", "{run_dir}/telemetry.jsonl"]
maps = ["depot", "loop"]
profiles = ["courier", "careful"]

[batch]
seeds = [1, 7, 19]
deciders = ["rule", "mock"]
seconds = 16
workers = 2
wall_timeout_s = 10
bootstrap_samples = 100
bootstrap_seed = 0

[decider]
backend = "mock"
budget_usd = 0.0

[tuning]
keys = "../../../examples/switchyard/tuning_keys.json"
candidates = [{}]

[checks]
oracle_args = ["--scenario", "stuck"]
oracle_seconds = 8
oracle_kind = "stuck"
visibility_command = ["{python}", "-m", "examples.switchyard.checks"]
